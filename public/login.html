<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge AI | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="login">
  <nav class="navbar">
    <div class="container nav-inner">
      <div class="brand"><div class="brand-mark"><i class="fa-solid fa-bridge"></i></div><span>SKILLBRIDGE AI</span></div>
      <div class="nav-cta">
        <button class="btn btn-outline" onclick="window.location.href='/'">Home</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="form-shell">
      <div class="center">
        <div class="brand-mark" style="margin:0 auto 16px; width:54px; height:54px;"><i class="fa-solid fa-bridge"></i></div>
        <h2>Welcome back</h2>
        <p class="muted">Sign in to continue your skill journey.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password" required />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;">Login</button>
      </form>

      <div class="inline-links">
        <span>Need an account? <a href="/register.html">Register</a></span>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
