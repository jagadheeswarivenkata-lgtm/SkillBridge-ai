<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge AI | Evidence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="evidence">
  <div class="container app-shell">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="brand" style="padding: 4px 10px 20px;">
          <div class="brand-mark"><i class="fa-solid fa-bridge"></i></div>
          <span>SKILLBRIDGE</span>
        </div>
        <div class="nav-section">
          <a class="nav-item" href="/dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
          <a class="nav-item" href="/profile.html"><i class="fa-solid fa-user"></i> Profile</a>
          <a class="nav-item" href="/target-role.html"><i class="fa-solid fa-bullseye"></i> Target Role</a>
          <div class="nav-item active"><i class="fa-solid fa-folder-open"></i> Evidence</div>
          <a class="nav-item" href="/skill-gap.html"><i class="fa-solid fa-chart-column"></i> Skill Gap</a>
        </div>
      </aside>
      <main class="content-area">
        <div class="topbar"><div class="topbar-search"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Evidence search" /></div></div><div class="user-menu"><div class="avatar">S</div><button class="btn btn-outline" id="logoutButton">Logout</button></div></div>
        <div class="panel" style="margin-top:20px; padding:24px;">
          <h3>Submit Evidence</h3>
          <form id="evidenceForm" enctype="multipart/form-data">
            <div class="auth-grid">
              <div class="form-group"><label>Evidence Title</label><input name="title" required /></div>
              <div class="form-group"><label>Skill / Category</label><input name="skillCategory" /></div>
              <div class="form-group"><label>Type</label><select name="category"><option>Project</option><option>Assignment</option><option>Assessment</option><option>Demonstration</option><option>Certificate</option><option>Internship</option><option>GitHub/project link</option><option>Uploaded document</option></select></div>
              <div class="form-group"><label>Difficulty</label><select name="difficultyLevel"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div>
              <div class="form-group" style="grid-column:1 / -1;"><label>Description</label><textarea name="description" required></textarea></div>
              <div class="form-group"><label>Project URL</label><input name="projectUrl" /></div>
              <div class="form-group"><label>Submission Date</label><input type="date" name="date" /></div>
              <div class="form-group" style="grid-column:1 / -1;"><label>Upload File</label><input type="file" name="file" /></div>
            </div>
            <button class="btn btn-primary" type="submit">Submit Evidence</button>
          </form>
        </div>
        <div class="panel" style="margin-top:18px; padding:24px;">
          <h3>Evidence Timeline</h3>
          <div id="evidenceList" class="card-stack"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
